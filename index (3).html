<style>
/* Layout: a light "deal desk" — a slim market-wire strip on top, deal tickets with a perforated stub in a two-column grid, a sticky allocation meter. Deliberately single light theme. */
:root{
  color-scheme:light;
  --bg:#F4F8F8; --paper:#FFFFFF; --ink:#18303A; --muted:#5B6E75; --line:#D8E3E4; --soft:#EAF2F2;
  --teal:#0E7C78; --teal-ink:#FFFFFF; --coral:#D9573A; --coral-soft:#FCE9E3;
  --good:#1F7A4D; --good-soft:#E1F4E9; --bad:#B23A2E; --bad-soft:#FBE6E2;
  --c-fin:#DDF3EC; --c-fin-ink:#11624F; --c-assoc:#ECE7FA; --c-assoc-ink:#4E3D8C; --c-jv:#FFF2CF; --c-jv-ink:#7A5A00;
  --c-sub:#E2EEFB; --c-sub-ink:#1E4F8A; --c-se:#FDE7DC; --c-se-ink:#8A3B1A;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Public Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .bar{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,var(--teal) 50%,var(--coral) 50%);display:block}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:999px;padding:3px 10px}
.wire{background:var(--coral-soft);color:var(--ink);border-top:1px solid var(--line);font-family:var(--mono);font-size:12.5px;overflow:hidden;white-space:nowrap}
.wire span{display:inline-block;padding:6px 0;padding-left:100%;animation:run 45s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.wire span{animation:none;padding-left:16px}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(30px,5.5vw,50px);line-height:1.06;font-weight:800}
h2{font-size:clamp(21px,3.6vw,28px);line-height:1.2;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;font-weight:600}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:130px;font-family:var(--mono);font-size:12.5px}
label{font-weight:600;font-size:13.5px;display:block;margin-bottom:5px}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.06em}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
/* hero boxes */
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.five div{border-radius:10px;padding:12px 10px;font-weight:700;font-size:13.5px;line-height:1.25;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.five small{font-family:var(--mono);font-weight:500;font-size:11.5px}
@media(max-width:620px){.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.role{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.role button{text-align:left;padding:22px;border-radius:var(--r);display:flex;flex-direction:column;gap:6px}
.role b{font-family:var(--display);font-size:21px}
.role span{font-weight:400;color:var(--muted)}
/* deal tickets */
.deals{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.ticket{display:grid;grid-template-columns:92px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.ticket.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.stub{background:var(--soft);border-right:2px dashed var(--line);padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.stub .amt{font-family:var(--mono);font-weight:600;font-size:22px}
.stub .u{font-size:11px;color:var(--muted)}
.tbody{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tag{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.t-debt{background:var(--c-fin);color:var(--c-fin-ink)} .t-eq{background:var(--c-sub);color:var(--c-sub-ink)} .t-con{background:var(--c-jv);color:var(--c-jv-ink)} .t-fin{background:var(--c-fin);color:var(--c-fin-ink)} .t-assoc{background:var(--c-assoc);color:var(--c-assoc-ink)} .t-jv{background:var(--c-jv);color:var(--c-jv-ink)} .t-sub{background:var(--c-sub);color:var(--c-sub-ink)} .t-se{background:var(--c-se);color:var(--c-se-ink)}
.facts{font-size:13.5px;color:var(--muted);margin:0;padding-left:18px}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick select{flex:1 1 180px;width:auto}
.toggle{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}
/* meter */
.meter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 220px;height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .2s}
.bar.over i{background:var(--coral)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* statements */
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.st td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.st td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.st tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.st tr.sub td{color:var(--muted);font-size:13.5px}
.tw{overflow-x:auto}
.flag{background:var(--coral-soft);border-left:4px solid var(--coral);border-radius:8px;padding:10px 12px;font-size:14px}
.okbox{background:var(--good-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.nobox{background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.news{display:grid;gap:10px}
.news div{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:8px;padding:10px 14px}
.news b{font-family:var(--display)}
.big{font-family:var(--mono);font-weight:600;font-size:clamp(28px,4.4vw,52px);letter-spacing:.03em;line-height:1;white-space:nowrap}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px;font-family:var(--mono);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 12px}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
table.lb{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.lb th,table.lb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.lb th:nth-child(2),table.lb td:nth-child(2){text-align:left;white-space:normal}
table.lb th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.token{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--soft);border-radius:8px;padding:12px;user-select:all}
.score{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
</style>

<header class="top"><div class="bar"><button class="brand" id="brand" type="button"><i aria-hidden="true"></i>Deal Desk</button><div class="chips" id="chips"></div></div><div class="wire" id="wire" hidden><span id="wireText"></span></div></header>
<main id="app" class="wrap"></main>

<script>
(function(){
"use strict";
/* ============ content ============ */
const BOX={AC:"Amortised cost",FVOCI:"FVOCI",FVTPL:"FVTPL",ASSOC:"Equity method: associate",JV:"Equity method: joint venture",JO:"Own share of assets, liabilities, income (joint operation)",SUB:"Consolidate (control)"};
const TAGC={debt:"t-debt",eq:"t-eq",con:"t-con"};
const DEALS=[
 {id:"gsec",kind:"debt",tag:"debt",label:"Debt security",name:"7.10% Government of India bond, 2034",t:200,coupon:.071,dur:7.0,ok:["AC","FVOCI","FVTPL"],
  facts:["Bought at par; pays 7.1% a year","Duration about 7 years: price falls ~7% for every 1% rise in yields","You choose the business model: hold to collect, collect and sell, or trade"]},
 {id:"psu",kind:"debt",tag:"debt",label:"Debt security",name:"8.00% AAA PSU bond, 3 years",t:150,coupon:.08,dur:2.7,ok:["AC","FVOCI","FVTPL"],
  facts:["Bought at par; pays 8% a year","Duration about 2.7 years","You choose the business model"]},
 {id:"mf",kind:"mf",tag:"debt",label:"Fund units",name:"Liquid mutual fund units",t:100,ret:.065,ok:["FVTPL"],
  facts:["Redeemable any day at NAV","Expected return about 6.5% a year","Returns depend on the fund's holdings, not fixed interest"]},
 {id:"bank",kind:"eq",tag:"eq",label:"Equity stake · 2%",name:"2% stake in Coastal Bank Ltd (listed)",t:200,div:.01,ok:["FVTPL","FVOCI"],
  facts:["No board seat, no say in policy","Dividend yield about 1%","Long-term holding: you may make the irrevocable FVOCI election on day one, or not"]},
 {id:"volt",kind:"assoc",tag:"eq",label:"Equity stake · 26%",name:"26% of VoltNest Batteries (start-up)",t:150,share:.26,ok:["ASSOC"],
  facts:["You get 2 of 7 board seats","VoltNest supplies battery cells to your products","Not listed: no market price"]},
 {id:"port",kind:"jv",tag:"eq",label:"Equity stake · 50%",name:"50% of PortLink Terminals Ltd",t:250,share:.5,ok:["JV"],
  facts:["Partner: a port operator, also 50%","Contract: every major decision needs both partners' consent","PortLink is a separate company with its own balance sheet"]},
 {id:"resin",kind:"sub",tag:"eq",label:"Equity stake · 60%",name:"60% of Andhra Resins (key supplier)",t:300,share:.6,gross:900,debt:500,na:400,ok:["SUB"],
  facts:["You appoint 4 of 7 directors","Andhra Resins: total assets ₹900 cr, debt ₹500 cr, net assets at fair value ₹400 cr","Price paid ₹300 cr for 60% of ₹400 cr: goodwill ₹60 cr"]},
 {id:"pipe",kind:"jo",tag:"con",label:"Contract · 40% share",name:"40% share of the Godavari crude pipeline",t:120,profit:30,share:.4,ok:["JO"],
  facts:["Contract with two oil companies: each partner owns its share of the pipeline and owes its share of the costs","There is no separate pipeline company","The pipeline earns about ₹30 cr a year in total"]},
 {id:"spv",kind:"se",tag:"eq",label:"Equity stake · 2%",name:"GreenLease Solar SPV",t:10,profit:12,gross:510,debt:500,ok:["SUB"],
  facts:["You own only 2% of its shares","You guarantee its ₹500 cr bank loan and decide which solar projects it funds","A service contract passes all its profits (about ₹12 cr a year) to you"]}
];
const CASH=1000, OPAT=400, EQUITY=4000, LIAB=3000, BORR=1500, CASH_RATE=.06;
const EV={
 rate:{label:"RBI repo rate",vals:[-50,0,25,50,75,100],fmt:v=>(v>0?"+":"")+v+" bp",def:3},
 bank:{label:"Coastal Bank share price",vals:[-20,-10,0,10,20,30],fmt:v=>(v>0?"+":"")+v+"%",def:4},
 volt:{label:"VoltNest net profit (₹ cr)",vals:[-200,0,80],fmt:v=>(v>0?"+":"")+v,def:0},
 port:{label:"PortLink net profit (₹ cr)",vals:[30,60,90],fmt:v=>String(v),def:1},
 resin:{label:"Andhra Resins net profit (₹ cr)",vals:[40,80,120],fmt:v=>String(v),def:1}
};
const EVK=["rate","bank","volt","port","resin"];
const PIN="FSA2026", SALT="iimv-fsa-deal-desk";

/* ============ utils ============ */
function h53(str,seed){let h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function chk(sess,n){const h=h53(String(sess).toUpperCase()+"|"+n+"|"+SALT);return A[h%31]+A[Math.floor(h/31)%31];}
function encodeEv(sess,idx){let n=0,m=1;EVK.forEach(k=>{n+=idx[k]*m;m*=EV[k].vals.length;});return "MKT-"+String(n).padStart(3,"0")+"-"+chk(sess,n);}
function decodeEv(sess,code){let c=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^MKT/,"");if(c.length!==5)return null;const dg=c.slice(0,3).replace(/O/g,"0").replace(/[IL]/g,"1");const mm=[null,dg,c.slice(3)];if(!/^\d{3}$/.test(dg))return null;const n=+mm[1];if(chk(sess,n)!==mm[2])return null;let r=n;const idx={};for(const k of EVK){const L=EV[k].vals.length;idx[k]=r%L;r=Math.floor(r/L);}if(r!==0)return null;return idx;}
const evVals=idx=>Object.fromEntries(EVK.map(k=>[k,EV[k].vals[idx[k]]]));
function evN(idx){let n=0,m=1;EVK.forEach(k=>{n+=idx[k]*m;m*=EV[k].vals.length;});return n;}
function nIdx(n){const idx={};for(const k of EVK){const L=EV[k].vals.length;idx[k]=n%L;n=Math.floor(n/L);}return idx;}
const NMAX=EVK.reduce((a,k)=>a*EV[k].vals.length,1);
const scr=n=>(n*389+211)%997;
function bchk(sess,m){const h=h53(String(sess).toUpperCase()+"|brief|"+m+"|"+SALT);return A[h%31]+A[Math.floor(h/31)%31];}
function encodeBr(sess,idx){const m=scr(evN(idx));return "BRF-"+String(m).padStart(3,"0")+"-"+bchk(sess,m);}
function decodeBr(sess,code){let c=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^BRF/,"");if(c.length!==5)return null;const dg=c.slice(0,3).replace(/O/g,"0").replace(/[IL]/g,"1");if(!/^\d{3}$/.test(dg))return null;const m=+dg;if(bchk(sess,m)!==c.slice(3))return null;for(let n=0;n<NMAX;n++)if(scr(n)===m)return nIdx(n);return null;}
const HINT={
 rate:["CPI inflation falls to 3.4%, well inside the RBI's band, while GDP growth slows to 5.9%.","Inflation steady at 4.6%; MPC minutes describe the stance as 'watchful'.","Vegetable prices push CPI to 5.4%; two MPC members flag 'upside risks'.","CPI jumps to 6.3%, above the RBI's tolerance band. Governor: inflation 'must be brought back to target'.","CPI above 6.5% for a third month, and the rupee hits a record low against the dollar.","CPI crosses 7% as crude spikes; bond traders brace for 'aggressive action'."],
 bank:["Unsecured-loan defaults rise sharply; the RBI warns lenders on credit-card growth.","Coastal Bank's deposit growth lags peers; margins under pressure.","Bank results in line with expectations; analysts call the sector 'fairly valued'.","System credit growth steady at 14%; bad loans at multi-year lows.","Coastal Bank wins a large government-payments mandate; two brokers upgrade the stock.","Market talk: a foreign bank is said to be eyeing a stake in Coastal Bank."],
 volt:["Cheap imported battery cells flood the market; cell prices fall 30% in a quarter.","EV two-wheeler sales flat for the quarter; battery makers hold prices.","EV two-wheeler sales double; makers scramble for locally made cells."],
 port:["Monsoon disruptions slow cargo at east-coast ports.","Container traffic at Vizag steady through the quarter.","Record coal and container volumes at east-coast terminals."],
 resin:["Crude prices jump; resin makers struggle to pass on costs.","Crude stable; resin demand from packaging firms holds up.","Crude falls and packaging demand surges; resin margins widen."]};
const NOISE=["Monsoon forecast 'normal' for the third year running.","Sensex ends the week flat in thin trading.","Government extends the PLI scheme deadline for electronics."];
function briefing(sess,idx){const h=h53(String(sess).toUpperCase()+"|pick");const opt=["volt","port","resin"];const drop=opt[h%3];const keys=["rate","bank"].concat(opt.filter(k=>k!==drop));const items=keys.map(k=>HINT[k][idx[k]]);items.push(NOISE[Math.floor(h/3)%3]);const order=items.map((t,i)=>[h53(t+sess),t]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);return order;}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)));};
function makeToken(o){const p=b64e(JSON.stringify(o));return "DD1."+p+"."+h53(p+SALT).toString(36).slice(0,7);}
function readToken(tk){try{const [a,p,c]=tk.split(".");if(a!=="DD1"||h53(p+SALT).toString(36).slice(0,7)!==c)return null;return JSON.parse(b64d(p));}catch(e){return null;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const r1=x=>Math.round(x*10)/10;
function f(x){x=r1(x);const s=Math.abs(x).toLocaleString("en-IN",{minimumFractionDigits:x%1?1:0,maximumFractionDigits:1});return (x<0?"−":"")+s;}
function parseNum(s){let t=String(s??"").trim().replace(/[₹,\s]|cr/gi,"");let neg=false;if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}t=t.replace(/[−–]/g,"-");const v=parseFloat(t);return neg?-v:v;}
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function copyText(text,btn){const done=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1500);};const fb=()=>{const el=btn.closest(".panel")?.querySelector(".token");if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}btn.textContent="Press Ctrl+C";};try{navigator.clipboard.writeText(text).then(done,fb);}catch(e){fb();}}

/* ============ the model ============ */
function compute(portfolio,ev){
  // portfolio: {dealId: boxKey} for chosen deals
  const L={pl:[],oci:[],flags:[],bs:[]};let econ=0,mtm=0,invested=0,addAssets=0,addDebt=0,nci=0,hidden=0,correct=0,wrong=0;
  for(const d of DEALS){
    if(!(d.id in portfolio))continue;
    const box=portfolio[d.id];invested+=d.t;
    const ok=d.ok.includes(box);if(ok)correct++;else wrong++;
    const use=ok?box:d.ok[0];
    if(!ok)L.flags.push({d,box,use});
    if(d.kind==="debt"){
      const inc=d.coupon*d.t, fv=-d.dur*ev.rate/10000*d.t;econ+=inc+fv;
      L.pl.push([d.name+": interest",inc]);
      if(use==="FVOCI")L.oci.push([d.name+": fair value change",fv]);

    }else if(d.kind==="assoc"){const s=d.share*ev.volt;econ+=s;L.pl.push(["Share of profit/(loss) of associate: VoltNest (26%)",s]);}
    else if(d.kind==="jv"){const s=d.share*ev.port;econ+=s;L.pl.push(["Share of profit of joint venture: PortLink (50%)",s]);}
    else if(d.kind==="sub"){const p=ev.resin;econ+=d.share*p;L.pl.push(["Andhra Resins: 100% of its profit (consolidated)",p]);L.pl.push(["Less: non-controlling interest (40%)",-(1-d.share)*p]);nci+=(1-d.share)*d.na;addAssets+=d.gross+60-d.t;addDebt+=d.debt;}
    else if(d.kind==="jo"){const s=d.share*d.profit;econ+=s;L.pl.push(["Godavari pipeline: your 40% of revenue less costs (line by line)",s]);}
    else if(d.kind==="se"){econ+=d.profit;L.pl.push(["GreenLease SPV: profit (consolidated)",d.profit]);addAssets+=d.gross-d.t;addDebt+=d.debt;}
  }

  const plInv=L.pl.reduce((a,x)=>a+x[1],0), oci=L.oci.reduce((a,x)=>a+x[1],0);
  const pat=OPAT+cashInt+plInv, core=pat-mtm;

  const an=[r1(pat),r1(oci),r1(core),Math.round(de*100)/100];
  return {L,econ,pat,oci,core,mtm,hidden,cashLeft,cashInt,invested,roe,debt,borr,de,nci,addAssets,correct,wrong,an};
}

function y1Value(d,ev1){if(d.kind==="debt")return d.t-d.dur*ev1.rate/10000*d.t;if(d.kind==="eq")return d.t*(1+ev1.bank/100);return d.t;}
function compute2(port,ev1,e2,sell){
  const L={pl:[],oci:[],eq:[]};let econ=0,recyc=0,imp=0,hidden=0,invested=0,cash=0;
  for(const d of DEALS){if(!(d.id in port))continue;invested+=d.t;const use=useBox(d,port[d.id]);

      if(sell[d.id]){cash+=v1;if(use==="FVOCI")L.eq.push([d.name+": OCI reserve moved to retained earnings, never through profit",fv1]);else L.pl.push([d.name+": sold at fair value, no further gain",0]);}
      else{const dv=d.div*d.t,fv2=e2.bank/100*v1;econ+=dv+fv2;L.pl.push([d.name+": dividend",dv]);if(use==="FVOCI")L.oci.push([d.name+": fair value change (never recycled)",fv2]);else L.pl.push([d.name+": fair value change",fv2]);}}
    else if(d.kind==="mf"){const inc=d.ret*d.t;econ+=inc;L.pl.push([d.name+": fair value gain (return)",inc]);}
    else if(d.kind==="assoc"){const c1=Math.max(0,d.t+d.share*ev1.volt),s2=Math.max(d.share*e2.volt,-c1),c2=c1+s2,im=Math.max(0,c2-e2.voltRA);
      L.pl.push(["Share of profit/(loss) of associate: VoltNest (26%)",s2]);if(im>0){L.pl.push(["Impairment of investment in VoltNest (whole investment tested; carrying ₹"+f(c2)+" cr vs recoverable ₹"+e2.voltRA+" cr)",-im]);imp+=im;}econ+=s2-im;}
    else if(d.kind==="jv"){const s=d.share*ev1.port;econ+=s;L.pl.push(["Share of profit of joint venture: PortLink (50%)",s]);}
    else if(d.kind==="jo"){const s=d.share*d.profit;econ+=s;L.pl.push(["Godavari pipeline: your 40% of revenue less costs (line by line)",s]);}
    else if(d.kind==="sub"){const p=ev1.resin;L.pl.push(["Andhra Resins: 100% of its profit (consolidated)",p]);L.pl.push(["Less: non-controlling interest (40%)",-(1-d.share)*p]);econ+=d.share*p;

  af.onsubmit=e=>{e.preventDefault();const g=[q1,q2,q3,q4].map(x=>parseNum(x.value));if(g.some(v=>!isFinite(v))){alertBox("Enter a number for questions 1 to 4.");return;}pp.ans={g,note:q5.value.trim()};saveP();setView("result");};
  function alertBox(t){let el=document.getElementById("aerr");if(!el){el=document.createElement("p");el.id="aerr";el.className="err";af.appendChild(el);}el.textContent=t;}
}
function y1(pp){const ev=evVals(pp.ev),R=compute(pp.port,ev);const g=pp.ans.g;const ok=R.an.map((v,i)=>i===3?Math.abs(g[i]-v)<=0.011:Math.abs(g[i]-v)<=Math.max(1,Math.abs(v)*.01));const an=ok.filter(Boolean).length;const score=Math.round(R.econ)+20*R.correct-30*R.wrong+30*an;return {ev,R,ok,an,score};}
function fmtA(v,i){return i===3?Number(v).toFixed(2):f(v);}
function result(){
  const pp=P(),Y=y1(pp),ev=Y.ev,R=Y.R,ok=Y.ok,an=Y.an,score=Y.score;
  const labels=["PAT attributable to owners","Total OCI","Core PAT","Debt-to-equity"];
  const tk=makeToken({y:1,s:S.session,t:S.team,econ:r1(R.econ),pat:r1(R.pat),roe:Math.round(R.roe*10000)/10000,oci:r1(R.oci),cr:R.correct,wr:R.wrong,an,score});
  const story=[];
  if(R.hidden)story.push(`Your amortised-cost bonds lost ₹${f(-R.hidden)} cr of market value that appears nowhere in profit or OCI.`);
  if(R.mtm)story.push(`₹${f(R.mtm)} cr of your profit is fair value change on FVTPL holdings: it can reverse next quarter.`);
  if(R.oci)story.push(`₹${f(R.oci)} cr sits in OCI, outside profit.`);
  if(pp.port.resin)story.push(`Consolidating Andhra Resins added ₹500 cr of debt and ₹160 cr of non-controlling interest.`);
  if(pp.port.spv)story.push(`GreenLease brings ₹500 cr of guaranteed debt onto your balance sheet for a 2% stake.`);
  if(pp.port.volt&&ev.volt<0)story.push(`VoltNest's loss hit your profit through one line: share of loss of associate.`);
  if(pp.port.pipe)story.push(`The pipeline is a joint operation: your 40% of its assets and costs sits inside your own line items, with no investment line at all.`);
  if(R.borr>BORR)story.push(`Borrowings rose from ₹1,500 cr to ₹${f(R.borr)} cr, so debt-to-equity went from 0.38 to ${R.de.toFixed(2)}, without you borrowing a rupee yourself.`);
  app.innerHTML=`<div class="stack">
   <div><p class="eyebrow">Verdict · Team ${esc(S.team)}</p><h2>Manager and analyst, scored.</h2></div>
   <div class="kpis"><div><p class="small muted">Economic return</p><div class="score">₹${f(R.econ)}</div><p class="small muted">cr: what your investments really earned</p></div>
    <div><p class="small muted">Reported PAT</p><div class="score">₹${f(R.pat)}</div><p class="small muted">cr · ROE ${(R.roe*100).toFixed(1)}%</p></div>
    <div><p class="small muted">Accounting boxes right</p><div class="score">${R.correct}/${R.correct+R.wrong}</div></div>
    <div><p class="small muted">Score</p><div class="score">${f(score)}</div></div></div>
   <div class="panel stack"><h3>Your analysis</h3>${labels.map((l,i)=>`<div class="${ok[i]?"okbox":"nobox"}"><b>${l}:</b> you said ${fmtA(pp.ans.g[i],i)}, the answer is <b>${fmtA(R.an[i],i)}</b>.</div>`).join("")}</div>
   ${story.length?`<div class="panel stack"><h3>What your accounts say, and what they hide</h3><ul style="margin:0;padding-left:20px" class="stack">${story.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
   <div class="panel stack"><p class="eyebrow">Year 1 result token</p><p class="small muted">Paste this into the class chat or form when your instructor asks.</p><div class="token">${tk}</div><div class="row"><button type="button" class="primary" id="cp">Copy token</button><button type="button" id="goY2">Go to Year 2</button></div></div>
   <p class="small muted">Score = economic return + 20 per correct box − 30 per wrong box + 30 per correct analyst answer.</p></div>`;
  cp.onclick=()=>copyText(tk,cp);goY2.onclick=()=>setView(pp.ans2?"y2result":pp.ev2?"y2analyst":pp.y2locked?"y2wait":"y2plan");
}
/* ============ boot ============ */
document.getElementById("brand").onclick=()=>{if(S.role==="instructor"&&S.session)setView("instr");else if(S.role==="student"&&S.team){const pp=P();setView(pp.ans2?"y2result":pp.ev2?"y2analyst":pp.y2locked?"y2wait":pp.ans?"result":pp.ev?"analyst":pp.locked?"wait":"desk");}else setView("home");};
function start(data){const sv=(data&&data.view)?data:store.get("dd-state");if(sv&&sv.view)Object.assign(S,sv);
  if(["y2plan","y2wait","y2analyst","y2result"].includes(S.view)){if(!(S.team&&S.session))S.view="home";else{const pp=P();if(!pp.ans)S.view="desk";else if(S.view==="y2result"&&!pp.ans2)S.view=pp.ev2?"y2analyst":pp.y2locked?"y2wait":"y2plan";else if(S.view==="y2analyst"&&!pp.ev2)S.view=pp.y2locked?"y2wait":"y2plan";}}
  if(["desk","wait","analyst","result"].includes(S.view)){if(!(S.team&&S.session))S.view="home";else{const pp=P();if(S.view==="result"&&!pp.ans)S.view=pp.ev?"analyst":pp.locked?"wait":"desk";if(S.view==="analyst"&&!pp.ev)S.view=pp.locked?"wait":"desk";if(S.view==="wait"&&!pp.locked)S.view="desk";}}
  if(S.view==="instr"&&!S.session)S.view="home";render();}
window.__dd={compute,encodeEv,decodeEv,evVals,makeToken,readToken,DEALS};
window.claude?.hot?.snapshot?.(()=>keep());
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
</body></html>
